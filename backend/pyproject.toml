[tool.poetry]
name = "whisperly-backend"
version = "0.1.0"
description = "FastAPI backend for Whisperly audio transcription"
authors = ["Aldrin Jenson <aldrinjenson@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
fastapi = "*"
uvicorn = "*"
python-multipart = "*"
openai = "*"
python-dotenv = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 